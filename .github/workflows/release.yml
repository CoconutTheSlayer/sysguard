name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run full checks
        run: make check

      - name: Build universal binaries
        run: |
          make clean
          make all ARCH="arm64 x86_64"
          lipo -info build/SysGuard.app/Contents/MacOS/SysGuard build/wtclean

      - name: Package release archive
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "$VERSION" != v* ]]; then
            VERSION="v2.0.0-$(git rev-parse --short HEAD)"
          fi
          mkdir -p dist/stage
          cp -R build/SysGuard.app dist/stage/SysGuard.app
          cp build/wtclean dist/stage/wtclean
          cp README.md LICENSE dist/stage/
          TAR_NAME="SysGuard-${VERSION}-macos-universal.tar.gz"
          tar -C dist/stage -czf "dist/${TAR_NAME}" SysGuard.app wtclean README.md LICENSE
          (cd dist && shasum -a 256 "${TAR_NAME}" > SHA256SUMS.txt)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAR_NAME=${TAR_NAME}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${VERSION}" \
            "dist/${TAR_NAME}" \
            "dist/SHA256SUMS.txt" \
            --title "SysGuard ${VERSION}" \
            --generate-notes
